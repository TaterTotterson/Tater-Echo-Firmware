name: Tater Echo Firmware Release

# One annotated vX.Y.Z tag produces both artifacts for every supported target:
#   * factory: post-amonet installer, emOS payload, and Tater userspace
#   * ota:     the small A/B server update consumed by Tater over Wi-Fi
# A factory archive never contains Amazon's kernel or device trees. The
# installer builds the final image from the attached Echo's own boot partition.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version for a non-release validation run (vX.Y.Z)'
        required: false
        default: 'v0.0.0-dev'

env:
  ALPINE_ARMV7_DIGEST: >-
    sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d

jobs:
  biscuit:
    name: Echo Dot 2 (biscuit)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Select version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="${{ inputs.version }}"
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.-]+)?$ ]] || {
            echo "::error::version must look like v0.1.0"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: device/go.mod
          cache-dependency-path: device/go.sum

      - name: Run firmware regression tests
        run: |
          cd device
          go test -race \
            ./internal/actionbutton \
            ./internal/taternative \
            ./internal/wakeword/microwakeword \
            ./internal/aec \
            ./internal/beamformer \
            ./internal/processor \
            ./internal/server \
            ./internal/bindings/speaker
          python3 -m py_compile scripts/silent_stream_server.py

      - name: Build Android compiler image
        run: docker build -t echomuse-compiler device/compiler/

      - name: Compile Tater Echo userspace
        run: |
          mkdir -p device/build
          build_unix=$(date +%s)
          docker run --rm --entrypoint bash \
            -e CGO_LDFLAGS="-Wl,--hash-style=both" \
            -e CGO_CFLAGS="-Wno-deprecated-declarations -Wno-null-dereference" \
            -v "${{ github.workspace }}/device":/sdk \
            -v "${{ github.workspace }}/GoTinyAlsa":/GoTinyAlsa \
            echomuse-compiler -c "cd /sdk && go build -tags server \
              -ldflags '-X github.com/TaterTotterson/Tater-Echo-Firmware/internal/client.Version=${{ steps.version.outputs.version }} \
                        -X github.com/TaterTotterson/Tater-Echo-Firmware/internal/clock.BuildUnix=$build_unix' \
              -o build/server ./cmd/"

      - name: Build ARMv7 microWakeWord runtime
        run: device/build_microwakeword_runtime.sh

      - name: Fetch pinned Hey Tater model
        shell: bash
        run: |
          mkdir -p device/build/microwakeword-testdata
          curl -fL \
            https://raw.githubusercontent.com/TaterTotterson/Tater-Wake-Words/18f27f6086b4e7c5adfb9f884a80340e2e81970f/microWakeWordsV6/hey_tater.tflite \
            -o device/build/microwakeword-testdata/hey_tater.tflite
          echo 'd3bf0d87c5c00ccfeda3cebba528c5d4012a5aaae51e61b7b01ae5af9008b4b9  device/build/microwakeword-testdata/hey_tater.tflite' | sha256sum -c -

      - name: Compile emOS init32
        run: |
          mkdir -p emos/build
          docker run --rm -v "${{ github.workspace }}/emos":/emos -w /emos \
            echomuse-compiler bash -lc \
            '/opt/android/ndk/21.4.7075529/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang -static -O2 -Wall -o build/init32 init/init.c'

      - name: Build static Wi-Fi tools
        run: |
          mkdir -p emos/build/wpa
          docker run --rm -v "${{ github.workspace }}/emos":/emos \
            -v "${{ github.workspace }}/emos/build/wpa":/out -w /tmp \
            echomuse-compiler bash -lc '/emos/tools/build-wpa-supplicant.sh /out'
          cp emos/device/em-wifi emos/build/wpa/em-wifi

      - name: Set up qemu for BusyBox
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - name: Build static BusyBox and corresponding source
        run: |
          mkdir -p emos/build/bb
          docker run --rm --platform linux/arm/v7 \
            -v "${{ github.workspace }}/emos":/emos \
            -v "${{ github.workspace }}/emos/build/bb":/out -w /tmp \
            alpine@${{ env.ALPINE_ARMV7_DIGEST }} \
            sh /emos/tools/build-busybox.sh /out

      - name: Verify release inputs
        shell: bash
        run: |
          file device/build/server device/build/microwakeword-android/libtater_microwakeword.so \
            emos/build/init32 emos/build/wpa/wpa_supplicant emos/build/bb/busybox
          file device/build/server | grep -q '32-bit.*ARM'
          file device/build/microwakeword-android/libtater_microwakeword.so | grep -q '32-bit.*ARM'
          file emos/build/init32 | grep -q '32-bit LSB executable, ARM'
          file emos/build/init32 | grep -q 'statically linked'
          file emos/build/wpa/wpa_supplicant | grep -q '32-bit LSB executable, ARM'
          file emos/build/wpa/wpa_supplicant | grep -q 'statically linked'
          file emos/build/bb/busybox | grep -q '32-bit LSB executable, ARM'
          file emos/build/bb/busybox | grep -q 'statically linked'
          strings device/build/server | grep -qF '${{ steps.version.outputs.version }}'
          python3 -m unittest factory.biscuit.test_install

      - name: Exercise emOS invariants
        run: |
          cc -O2 -Wall -o /tmp/ringsim emos/init/ringsim.c -lm
          /tmp/ringsim --check
          for check in pwcheck tmoutcheck wpacheck cmdlinecheck serialcheck; do
            cc -O2 -o "/tmp/$check" "emos/init/$check.c"
            "/tmp/$check"
          done

      - name: Package factory and OTA firmware
        run: |
          python3 tools/package_echo_release.py \
            --version '${{ steps.version.outputs.version }}' \
            --target biscuit --output release
          mkdir /tmp/tater-factory-check
          tar -xzf release/tater-echo-biscuit-${{ steps.version.outputs.version }}-factory.tar.gz \
            -C /tmp/tater-factory-check
          /tmp/tater-factory-check/*/install.sh --verify-bundle
          (cd release && sha256sum -c SHA256SUMS)

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: tater-echo-biscuit-${{ steps.version.outputs.version }}
          path: release/
          if-no-files-found: error

      - name: Read annotated tag notes
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [[ "$(git cat-file -t "$GITHUB_REF_NAME")" != tag ]]; then
            echo "::error::$GITHUB_REF_NAME is lightweight; releases require an annotated tag"
            exit 1
          fi
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > /tmp/release-notes.md

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: Tater Echo Firmware ${{ steps.version.outputs.version }}
          files: release/*
          body_path: /tmp/release-notes.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
