name: Tater Echo Firmware Release

# One annotated vX.Y.Z tag builds every target, sharing one pinned/cached Linux
# ARMv7 ONNX Runtime, then publishes a single compatibility manifest. Biscuit
# and Radar produce factory + OTA emOS firmware;
# Checkers and Rook produce A/B application OTAs and USB Linux factory bundles
# around pinned, hash-verified TECHO5 hardware enablement.
# Biscuit and Radar share the Puffin emOS path.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version for a non-release validation run (vX.Y.Z)'
        required: false
        default: 'v0.0.0-dev'

env:
  ALPINE_ARMV7_DIGEST: >-
    sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d

jobs:
  onnxruntime-armv7:
    name: Shared Linux ARMv7 ONNX Runtime
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore pinned ONNX Runtime
        id: onnxruntime-cache
        uses: actions/cache@v6
        with:
          path: |
            device/build/onnxruntime-linux-armv7/libonnxruntime.so
            device/build/onnxruntime/include/onnxruntime_c_api.h
          key: tater-onnxruntime-linux-armv7-v1-${{ hashFiles('device/prepare_onnxruntime_linux_armv7.sh', 'device/onnxruntime/**') }}

      - name: Set up ARMv7 emulation
        if: steps.onnxruntime-cache.outputs.cache-hit != 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - name: Build pinned Linux ARMv7 ONNX Runtime
        if: steps.onnxruntime-cache.outputs.cache-hit != 'true'
        run: device/prepare_onnxruntime_linux_armv7.sh

      - name: Verify shared ONNX Runtime
        run: |
          file device/build/onnxruntime-linux-armv7/libonnxruntime.so \
            | grep -q '32-bit.*ARM'
          test -s device/build/onnxruntime/include/onnxruntime_c_api.h

      - name: Upload shared ONNX Runtime
        uses: actions/upload-artifact@v7
        with:
          name: tater-onnxruntime-linux-armv7
          path: |
            device/build/onnxruntime-linux-armv7/libonnxruntime.so
            device/build/onnxruntime/include/onnxruntime_c_api.h
          if-no-files-found: error

  biscuit:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: biscuit
            name: Echo Dot 2 (biscuit)
          - target: radar
            name: Echo 2 (radar, experimental)

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="${{ inputs.version }}"
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.-]+)?$ ]] || {
            echo "::error::version must look like v0.1.0"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: device/go.mod
          cache-dependency-path: device/go.sum

      - name: Run firmware regression tests
        run: |
          cd device
          go test -race \
            ./internal/actionbutton \
            ./internal/show \
            ./internal/taternative \
            ./internal/wakeword/microwakeword \
            ./internal/aec \
            ./internal/beamformer \
            ./internal/processor \
            ./internal/server \
            ./internal/bindings/speaker
          python3 -m py_compile scripts/silent_stream_server.py

      - name: Build Android compiler image
        run: docker build -t tater-echo-compiler device/compiler/

      - name: Build ARMv7 microWakeWord runtime
        run: device/build_microwakeword_runtime.sh

      - name: Fetch pinned wake models
        shell: bash
        run: |
          mkdir -p device/build/microwakeword-testdata
          curl -fL \
            https://raw.githubusercontent.com/TaterTotterson/Tater-Wake-Words/18f27f6086b4e7c5adfb9f884a80340e2e81970f/microWakeWordsV6/hey_tater.tflite \
            -o device/build/microwakeword-testdata/hey_tater.tflite
          echo 'd3bf0d87c5c00ccfeda3cebba528c5d4012a5aaae51e61b7b01ae5af9008b4b9  device/build/microwakeword-testdata/hey_tater.tflite' | sha256sum -c -
          curl -fL \
            https://raw.githubusercontent.com/TaterTotterson/Tater-Wake-Words/18f27f6086b4e7c5adfb9f884a80340e2e81970f/microWakeWordsV1/stop.tflite \
            -o device/build/microwakeword-testdata/stop.tflite
          echo '020ef80d522cb09169a866f3aeeb58f2ad4045461937e78e8c806df29ff61eea  device/build/microwakeword-testdata/stop.tflite' | sha256sum -c -
          device/prepare_onnxruntime_android.sh

      - name: Compile Tater Echo userspace
        run: |
          mkdir -p device/build
          device/prepare_biscuit_release_wake_assets.sh
          build_unix=$(date +%s)
          runtime_sha=$(sha256sum device/build/microwakeword-android/libtater_microwakeword.so | awk '{print $1}')
          ort_sha=$(sha256sum device/build/onnxruntime/armeabi-v7a/libonnxruntime.so | awk '{print $1}')
          docker run --rm --entrypoint bash \
            -e CGO_LDFLAGS="-Wl,--hash-style=both" \
            -e CGO_CFLAGS="-Wno-deprecated-declarations -Wno-null-dereference" \
            -v "${{ github.workspace }}/device":/sdk \
            tater-echo-compiler -c "cd /sdk && go build -tags server,releaseassets \
              -ldflags '-X github.com/TaterTotterson/Tater-Echo-Firmware/internal/client.Version=${{ steps.version.outputs.version }} \
                        -X github.com/TaterTotterson/Tater-Echo-Firmware/internal/client.FirmwareTarget=${{ matrix.target }} \
                        -X github.com/TaterTotterson/Tater-Echo-Firmware/internal/clock.BuildUnix=$build_unix \
                        -X github.com/TaterTotterson/Tater-Echo-Firmware/internal/wakeword/microwakeword.ReleaseRuntimeSHA256=$runtime_sha \
                        -X github.com/TaterTotterson/Tater-Echo-Firmware/internal/wakeword/microwakeword.ReleaseORTRuntimeSHA256=$ort_sha' \
              -o build/server ./cmd/"

      - name: Compile both emOS init architectures
        run: |
          mkdir -p emos/build
          docker run --rm -v "${{ github.workspace }}/emos":/emos -w /emos \
            tater-echo-compiler bash -lc \
            '/opt/android/ndk/21.4.7075529/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang -static -O2 -Wall -o build/init init/init.c && \
             /opt/android/ndk/21.4.7075529/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang -static -O2 -Wall -o build/init32 init/init.c'

      - name: Build static Wi-Fi tools
        run: |
          mkdir -p emos/build/wpa
          docker run --rm -v "${{ github.workspace }}/emos":/emos \
            -v "${{ github.workspace }}/emos/build/wpa":/out -w /tmp \
            tater-echo-compiler bash -lc '/emos/tools/build-wpa-supplicant.sh /out'
          cp emos/device/em-wifi emos/build/wpa/em-wifi

      - name: Set up qemu for BusyBox
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - name: Build static BusyBox and corresponding source
        run: |
          mkdir -p emos/build/bb
          docker run --rm --platform linux/arm/v7 \
            -v "${{ github.workspace }}/emos":/emos \
            -v "${{ github.workspace }}/emos/build/bb":/out -w /tmp \
            alpine@${{ env.ALPINE_ARMV7_DIGEST }} \
            sh /emos/tools/build-busybox.sh /out

      - name: Verify release inputs
        shell: bash
        run: |
          file device/build/server device/build/microwakeword-android/libtater_microwakeword.so \
            device/build/onnxruntime/armeabi-v7a/libonnxruntime.so \
            emos/build/init emos/build/init32 emos/build/wpa/wpa_supplicant emos/build/bb/busybox
          file device/build/server | grep -q '32-bit.*ARM'
          file device/build/microwakeword-android/libtater_microwakeword.so | grep -q '32-bit.*ARM'
          file device/build/onnxruntime/armeabi-v7a/libonnxruntime.so | grep -q '32-bit.*ARM'
          file emos/build/init | grep -q 'ARM aarch64'
          file emos/build/init | grep -q 'statically linked'
          file emos/build/init32 | grep -q '32-bit LSB executable, ARM'
          file emos/build/init32 | grep -q 'statically linked'
          file emos/build/wpa/wpa_supplicant | grep -q '32-bit LSB executable, ARM'
          file emos/build/wpa/wpa_supplicant | grep -q 'statically linked'
          file emos/build/bb/busybox | grep -q '32-bit LSB executable, ARM'
          file emos/build/bb/busybox | grep -q 'statically linked'
          strings device/build/server | grep -qF '${{ steps.version.outputs.version }}'
          runtime_sha=$(sha256sum device/build/microwakeword-android/libtater_microwakeword.so | awk '{print $1}')
          ort_sha=$(sha256sum device/build/onnxruntime/armeabi-v7a/libonnxruntime.so | awk '{print $1}')
          strings device/build/server | grep -qF "$runtime_sha" || {
            echo '::error::${{ matrix.target }} firmware is missing its wake-runtime digest'; exit 1; }
          strings device/build/server | grep -qF "$ort_sha" || {
            echo '::error::${{ matrix.target }} firmware is missing its ONNX Runtime digest'; exit 1; }
          test "$(stat -c %s device/build/server)" -gt 30000000 || {
            echo '::error::${{ matrix.target }} OTA does not contain its self-contained wake assets'; exit 1; }
          if readelf -Ws device/build/server | grep -E 'UND.* pcm_readi(@|$)' >/dev/null; then
            echo '::error::${{ matrix.target }} firmware requires unavailable pcm_readi'; exit 1;
          fi
          readelf -Ws device/build/server | grep -E 'UND.* pcm_read(@|$)' >/dev/null || {
            echo '::error::${{ matrix.target }} firmware is missing the compatible pcm_read import'; exit 1; }
          python3 -m unittest factory.biscuit.test_install

      - name: Exercise emOS invariants
        run: |
          cc -O2 -Wall -o /tmp/ringsim emos/init/ringsim.c -lm
          /tmp/ringsim --check
          for check in pwcheck tmoutcheck wpacheck cmdlinecheck serialcheck; do
            cc -O2 -o "/tmp/$check" "emos/init/$check.c"
            "/tmp/$check"
          done

      - name: Package factory and OTA firmware
        run: |
          python3 tools/package_echo_release.py \
            --version '${{ steps.version.outputs.version }}' \
            --target '${{ matrix.target }}' --output release
          mkdir /tmp/tater-factory-check
          tar -xzf release/tater-echo-${{ matrix.target }}-${{ steps.version.outputs.version }}-factory.tar.gz \
            -C /tmp/tater-factory-check
          /tmp/tater-factory-check/*/install.sh --verify-bundle
          (cd release && sha256sum -c SHA256SUMS)

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tater-echo-${{ matrix.target }}-${{ steps.version.outputs.version }}
          path: release/
          if-no-files-found: error

  checkers:
    name: Echo Show 5 (checkers) Tater Linux
    needs: onnxruntime-armv7
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="${{ inputs.version }}"
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.-]+)?$ ]] || {
            echo "::error::version must look like v0.1.0"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download shared ONNX Runtime
        uses: actions/download-artifact@v8
        with:
          name: tater-onnxruntime-linux-armv7
          path: device/build

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: device/go.mod
          cache-dependency-path: device/go.sum

      - name: Run Checkers Linux regression tests
        run: |
          python3 -m unittest discover -s linux/checkers -p 'test_*.py'
          python3 -m unittest discover -s factory/checkers-linux -p 'test_*.py'
          python3 -m py_compile \
            linux/checkers/build_rootfs.py \
            linux/checkers/brand_boot.py \
            linux/checkers/build_rescue_fbprobe.py \
            linux/checkers/provision_console.py \
            factory/checkers-linux/install.py
          cd device
          go test -race \
            ./cmd/tater-show-linux \
            ./internal/bluetooth \
            ./internal/platform \
            ./internal/taternative \
            ./internal/wifi \
            ./internal/show \
            ./internal/linuxinput \
            ./internal/linuxscreen \
            ./internal/wakeword/microwakeword \
            ./internal/aec \
            ./internal/beamformer \
            ./internal/bindings/mixer \
            ./pkg/board

      - name: Fetch pinned wake models
        shell: bash
        run: |
          mkdir -p device/build/microwakeword-testdata
          curl -fL \
            https://raw.githubusercontent.com/TaterTotterson/Tater-Wake-Words/18f27f6086b4e7c5adfb9f884a80340e2e81970f/microWakeWordsV6/hey_tater.tflite \
            -o device/build/microwakeword-testdata/hey_tater.tflite
          echo 'd3bf0d87c5c00ccfeda3cebba528c5d4012a5aaae51e61b7b01ae5af9008b4b9  device/build/microwakeword-testdata/hey_tater.tflite' | sha256sum -c -
          curl -fL \
            https://raw.githubusercontent.com/TaterTotterson/Tater-Wake-Words/18f27f6086b4e7c5adfb9f884a80340e2e81970f/microWakeWordsV1/stop.tflite \
            -o device/build/microwakeword-testdata/stop.tflite
          echo '020ef80d522cb09169a866f3aeeb58f2ad4045461937e78e8c806df29ff61eea  device/build/microwakeword-testdata/stop.tflite' | sha256sum -c -

      - name: Set up ARMv7 emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - name: Fetch pinned Checkers Linux platform
        run: |
          mkdir -p linux/checkers/inputs
          curl -fL \
            https://github.com/HuskerMinion/techo5/releases/download/v0.9.26/rootfs-v0.9.26.tar.gz \
            -o linux/checkers/inputs/rootfs-v0.9.26.tar.gz
          echo 'a72bbdfd0d26f536552b44aa9258f136e05d5243220c761a22c0f691a943f14e  linux/checkers/inputs/rootfs-v0.9.26.tar.gz' | sha256sum -c -
          curl -fL \
            https://github.com/HuskerMinion/techo5/releases/download/v0.7.16/techo5-boot-checkers-v0.7.16.img \
            -o linux/checkers/inputs/techo5-boot-checkers-v0.7.16.img
          echo '46c19fd23c210714e29eb2bf88c77b540f3290c0cf50b680b22032e7a4771da7  linux/checkers/inputs/techo5-boot-checkers-v0.7.16.img' | sha256sum -c -
          git clone --filter=blob:none https://github.com/HuskerMinion/techo5.git /tmp/techo5
          git -C /tmp/techo5 checkout 0f042360fbc22d798930cfd683d251606bfb7412

      # The pinned TECHO5 camera and rescue helpers require Go 1.26. The
      # preceding Tater regression suite continues to use device/go.mod's
      # Go 1.24; build_linux.sh cross-builds these helpers on the host.
      - name: Set up Go for pinned TECHO5 helpers
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          cache: false

      - name: Build Checkers Tater Linux image
        env:
          TATER_ALPINE_ARMV7_IMAGE: alpine@${{ env.ALPINE_ARMV7_DIGEST }}
        run: |
          linux/checkers/build_linux.sh \
            --version '${{ steps.version.outputs.version }}' \
            --base-rootfs linux/checkers/inputs/rootfs-v0.9.26.tar.gz \
            --techo5 /tmp/techo5 \
            --output device/build/tater-checkers-rootfs-${{ steps.version.outputs.version }}.tar.gz

      - name: Package and verify Checkers Linux firmware
        env:
          TATER_CHECKERS_ROOTFS: device/build/tater-checkers-rootfs-${{ steps.version.outputs.version }}.tar.gz
          TATER_CHECKERS_BOOT_IMAGE: linux/checkers/inputs/techo5-boot-checkers-v0.7.16.img
        run: |
          python3 tools/package_echo_release.py \
            --version '${{ steps.version.outputs.version }}' \
            --target checkers --output release
          mkdir /tmp/tater-checkers-factory-check
          tar -xzf release/tater-echo-checkers-${{ steps.version.outputs.version }}-factory.tar.gz \
            -C /tmp/tater-checkers-factory-check
          /tmp/tater-checkers-factory-check/*/install.sh --verify-bundle
          tar -tzf release/tater-echo-checkers-${{ steps.version.outputs.version }}-ota.tar.gz \
            | grep -Ex 'manifest.json|tater-echo|tater-show'
          (cd release && sha256sum -c SHA256SUMS)

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tater-echo-checkers-${{ steps.version.outputs.version }}
          path: release/
          if-no-files-found: error

  rook:
    name: Echo Spot 2017 (rook) Tater Linux
    needs: onnxruntime-armv7
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="${{ inputs.version }}"
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.-]+)?$ ]] || {
            echo "::error::version must look like v0.1.0"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download shared ONNX Runtime
        uses: actions/download-artifact@v8
        with:
          name: tater-onnxruntime-linux-armv7
          path: device/build

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: device/go.mod
          cache-dependency-path: device/go.sum

      - name: Run Rook regression tests
        run: |
          python3 -m unittest discover -s linux/rook -p 'test_*.py'
          python3 -m unittest discover -s factory/rook-linux -p 'test_*.py'
          python3 -m unittest tools.test_package_echo_release
          python3 -m py_compile \
            linux/rook/build_boot.py \
            linux/rook/build_rescue_fbprobe.py \
            linux/rook/build_rootfs.py \
            linux/rook/preflight.py \
            factory/rook-linux/build_factory.py \
            factory/rook-linux/install.py
          cd device
          go test -race \
            ./cmd/tater-show-linux \
            ./internal/bluetooth \
            ./internal/platform \
            ./internal/taternative \
            ./internal/wifi \
            ./internal/show \
            ./internal/linuxinput \
            ./internal/linuxscreen \
            ./internal/wakeword/microwakeword \
            ./internal/aec \
            ./internal/beamformer \
            ./internal/bindings/mixer \
            ./internal/bindings/speaker \
            ./pkg/board

      - name: Fetch pinned wake models
        shell: bash
        run: |
          mkdir -p device/build/microwakeword-testdata
          curl -fL \
            https://raw.githubusercontent.com/TaterTotterson/Tater-Wake-Words/18f27f6086b4e7c5adfb9f884a80340e2e81970f/microWakeWordsV6/hey_tater.tflite \
            -o device/build/microwakeword-testdata/hey_tater.tflite
          echo 'd3bf0d87c5c00ccfeda3cebba528c5d4012a5aaae51e61b7b01ae5af9008b4b9  device/build/microwakeword-testdata/hey_tater.tflite' | sha256sum -c -
          curl -fL \
            https://raw.githubusercontent.com/TaterTotterson/Tater-Wake-Words/18f27f6086b4e7c5adfb9f884a80340e2e81970f/microWakeWordsV1/stop.tflite \
            -o device/build/microwakeword-testdata/stop.tflite
          echo '020ef80d522cb09169a866f3aeeb58f2ad4045461937e78e8c806df29ff61eea  device/build/microwakeword-testdata/stop.tflite' | sha256sum -c -

      - name: Fetch pinned Rook platform and boot inputs
        run: |
          mkdir -p linux/rook/inputs
          base=https://github.com/HuskerMinion/techo5-spot/releases/download/spot-v0.5.25
          for name in techo5-spot-rootfs.tar.gz techo5-spot-kernel-bt.Image.gz-dtb techo5-spot-rescue.tar; do
            curl -fL "$base/$name" -o "linux/rook/inputs/$name"
          done
          curl -fL \
            https://github.com/amazon-oss/releases/releases/download/lineage-18.1-rook-v0.3/lineage-18.1-20251108-UNOFFICIAL-rook.zip \
            -o linux/rook/inputs/lineage-18.1-20251108-UNOFFICIAL-rook.zip
          curl -fL \
            https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/armv7/alpine-minirootfs-3.24.1-armv7.tar.gz \
            -o linux/rook/inputs/alpine-minirootfs-3.24.1-armv7.tar.gz
          echo 'c2960f9a2792868a2707fdc514594a034b404c6a472b049c4fb3397165fe0eb2  linux/rook/inputs/techo5-spot-rootfs.tar.gz' | sha256sum -c -
          echo '368738ee20b86dc3dc0268d3b4b145e67cca9666379ac26b2379abd6c9136298  linux/rook/inputs/techo5-spot-kernel-bt.Image.gz-dtb' | sha256sum -c -
          echo 'a6f3860d0e3bd5b298ff310d8fe0d6a9a7885a2f6aa792e4134783df4cbf15bf  linux/rook/inputs/techo5-spot-rescue.tar' | sha256sum -c -
          echo '2755428c124df88ffd3bc6a9c36db16bbe3b7e639883fd1092dc839ac5ae9d13  linux/rook/inputs/lineage-18.1-20251108-UNOFFICIAL-rook.zip' | sha256sum -c -
          echo '50942d567e6ee422c16cb46d5c282ed9d8adc9007c2a483faf4148a18c64ce32  linux/rook/inputs/alpine-minirootfs-3.24.1-armv7.tar.gz' | sha256sum -c -
          git clone --filter=blob:none https://github.com/HuskerMinion/techo5-spot.git /tmp/techo5-spot
          git -C /tmp/techo5-spot checkout 8253a4a1d52dd37dd152dd1d435b97e541e0a191
          git clone --filter=blob:none https://github.com/HuskerMinion/techo5.git /tmp/techo5
          git -C /tmp/techo5 checkout 0f042360fbc22d798930cfd683d251606bfb7412

      - name: Set up ARMv7 emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - name: Set up Go for pinned TECHO5 camera helper
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          cache: false

      - name: Build Rook boot and root filesystem
        env:
          TATER_ALPINE_ARMV7_IMAGE: alpine@${{ env.ALPINE_ARMV7_DIGEST }}
        run: |
          python3 linux/rook/build_boot.py \
            --lineage-zip linux/rook/inputs/lineage-18.1-20251108-UNOFFICIAL-rook.zip \
            --kernel linux/rook/inputs/techo5-spot-kernel-bt.Image.gz-dtb \
            --rescue linux/rook/inputs/techo5-spot-rescue.tar \
            --alpine-rootfs linux/rook/inputs/alpine-minirootfs-3.24.1-armv7.tar.gz \
            --spot-source /tmp/techo5-spot \
            --techo5 /tmp/techo5 \
            --output device/build/rook/tater-rook-boot.img
          sh linux/rook/build_linux.sh \
            --version '${{ steps.version.outputs.version }}' \
            --base-rootfs linux/rook/inputs/techo5-spot-rootfs.tar.gz \
            --spot-source /tmp/techo5-spot --techo5 /tmp/techo5 \
            --output device/build/rook/tater-rook-rootfs-${{ steps.version.outputs.version }}.tar.gz

      - name: Package and verify Rook firmware
        env:
          TATER_ROOK_BOOT_IMAGE: device/build/rook/tater-rook-boot.img
        run: |
          python3 tools/package_echo_release.py \
            --version '${{ steps.version.outputs.version }}' --target rook --output release
          mkdir /tmp/tater-rook-factory-check
          tar -xzf release/tater-echo-rook-${{ steps.version.outputs.version }}-factory.tar.gz \
            -C /tmp/tater-rook-factory-check
          /tmp/tater-rook-factory-check/*/install.sh --verify-bundle
          tar -tzf release/tater-echo-rook-${{ steps.version.outputs.version }}-ota.tar.gz \
            | grep -Ex 'manifest.json|tater-echo|tater-show'
          (cd release && sha256sum -c SHA256SUMS)

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tater-echo-rook-${{ steps.version.outputs.version }}
          path: release/
          if-no-files-found: error

  publish:
    name: Publish combined release
    if: github.ref_type == 'tag'
    needs: [biscuit, checkers, rook]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select version
        id: version
        shell: bash
        run: echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Download Biscuit artifacts
        uses: actions/download-artifact@v8
        with:
          name: tater-echo-biscuit-${{ steps.version.outputs.version }}
          path: staging/biscuit

      - name: Download Radar artifacts
        uses: actions/download-artifact@v8
        with:
          name: tater-echo-radar-${{ steps.version.outputs.version }}
          path: staging/radar

      - name: Download Checkers artifacts
        uses: actions/download-artifact@v8
        with:
          name: tater-echo-checkers-${{ steps.version.outputs.version }}
          path: staging/checkers

      - name: Download Rook artifacts
        uses: actions/download-artifact@v8
        with:
          name: tater-echo-rook-${{ steps.version.outputs.version }}
          path: staging/rook

      - name: Verify and merge target manifests
        run: |
          python3 tools/merge_release_manifests.py \
            --version '${{ steps.version.outputs.version }}' --output release \
            staging/biscuit/firmware-manifest.json \
            staging/radar/firmware-manifest.json \
            staging/checkers/firmware-manifest.json \
            staging/rook/firmware-manifest.json
          (cd release && sha256sum -c SHA256SUMS)

      - name: Read versioned changelog notes
        shell: bash
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [[ "$(git cat-file -t "$GITHUB_REF_NAME")" != tag ]]; then
            echo "::error::$GITHUB_REF_NAME is lightweight; releases require an annotated tag"
            exit 1
          fi
          python3 tools/release_notes.py "$GITHUB_REF_NAME" > /tmp/release-notes.md
          test -s /tmp/release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: Tater Echo Firmware ${{ steps.version.outputs.version }}
          files: release/*
          body_path: /tmp/release-notes.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
