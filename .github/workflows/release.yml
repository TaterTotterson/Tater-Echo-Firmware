name: Tater Echo Firmware Release

# One annotated vX.Y.Z tag builds every target, sharing a pinned/cached Linux
# ARMv7 ONNX Runtime and screen video decoder, then publishes one compatibility
# manifest. Every target produces a Tater Linux factory bundle and A/B
# application OTA around pinned, hash-verified low-level hardware enablement.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version for a non-release validation run (vX.Y.Z)'
        required: false
        default: 'v0.0.0-dev'

jobs:
  onnxruntime-armv7:
    name: Shared Linux ARMv7 ONNX Runtime
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Restore pinned ONNX Runtime
        id: onnxruntime-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            device/build/onnxruntime-linux-armv7/libonnxruntime.so
            device/build/onnxruntime-linux-armv7/.required-operators-sha256
            device/build/onnxruntime/include/onnxruntime_c_api.h
          key: tater-onnxruntime-linux-armv7-v1-${{ hashFiles('device/prepare_onnxruntime_linux_armv7.sh', 'device/onnxruntime/**') }}
          # The preparation script validates the cached ELF and required-op
          # fingerprint before accepting a compatible cache from an earlier
          # build-script revision. Keep this v1 fallback only while the pinned
          # runtime remains ONNX Runtime 1.19.2.
          restore-keys: |
            tater-onnxruntime-linux-armv7-v1-

      - name: Set up ARMv7 emulation
        if: steps.onnxruntime-cache.outputs.cache-hit != 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: arm

      - name: Prepare pinned Linux ARMv7 ONNX Runtime
        run: device/prepare_onnxruntime_linux_armv7.sh

      - name: Verify shared ONNX Runtime
        run: |
          file device/build/onnxruntime-linux-armv7/libonnxruntime.so \
            | grep -q '32-bit.*ARM'
          test -s device/build/onnxruntime-linux-armv7/.required-operators-sha256
          test -s device/build/onnxruntime/include/onnxruntime_c_api.h
          test "$(cat device/build/onnxruntime-linux-armv7/.required-operators-sha256)" = \
            "$(sha256sum device/onnxruntime/required_operators.config | awk '{print $1}')"

      - name: Upload shared ONNX Runtime
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tater-onnxruntime-linux-armv7
          path: |
            device/build/onnxruntime-linux-armv7/libonnxruntime.so
            device/build/onnxruntime-linux-armv7/.required-operators-sha256
            device/build/onnxruntime/include/onnxruntime_c_api.h
          if-no-files-found: error
          include-hidden-files: true

  ffmpeg-armv7:
    name: Shared pinned ARMv7 video decoder
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Restore pinned video decoder
        id: ffmpeg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            device/build/tater-ffmpeg
            device/build/FFMPEG-LGPL-2.1.txt
          key: tater-ffmpeg-armv7-${{ hashFiles('platforms/tater-echo-linux-lock.json', 'tools/fetch_platform_input.py') }}

      - name: Fetch decoder from pinned Tater Echo Linux release
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          python3 tools/fetch_platform_input.py \
            platforms.athena.video_decoder device/build/tater-ffmpeg
          python3 tools/fetch_platform_input.py \
            platforms.athena.video_decoder.license device/build/FFMPEG-LGPL-2.1.txt

      - name: Verify shared video decoder
        run: |
          file device/build/tater-ffmpeg | grep -q '32-bit.*ARM'
          test "$(sha256sum device/build/tater-ffmpeg | awk '{print $1}')" = \
            "$(python3 tools/platform_lock.py get platforms.athena.video_decoder.sha256)"
          test "$(stat -c %s device/build/tater-ffmpeg)" = \
            "$(python3 tools/platform_lock.py get platforms.athena.video_decoder.size)"
          grep -aq 'Two slices reporting being the first in the same frame' device/build/tater-ffmpeg
          strings device/build/tater-ffmpeg | grep -Eq -- '--enable-protocol=.*srtp'
          strings device/build/tater-ffmpeg | grep -Eq -- '--enable-decoder=.*aac.*mp3'
          strings device/build/tater-ffmpeg | grep -Eq -- '--enable-muxer=.*rawvideo.*pcm_s16le'
          test "$(sha256sum device/build/FFMPEG-LGPL-2.1.txt | awk '{print $1}')" = \
            "$(python3 tools/platform_lock.py get platforms.athena.video_decoder.license.sha256)"
          test "$(stat -c %s device/build/FFMPEG-LGPL-2.1.txt)" = \
            "$(python3 tools/platform_lock.py get platforms.athena.video_decoder.license.size)"

      - name: Upload shared video decoder
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tater-ffmpeg-linux-armv7
          path: |
            device/build/tater-ffmpeg
            device/build/FFMPEG-LGPL-2.1.txt
          if-no-files-found: error

  biscuit:
    name: ${{ matrix.name }}
    needs: onnxruntime-armv7
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: biscuit
            name: Echo Dot 2 (biscuit)
            kernel_name: tater-echo-biscuit-kernel.zImage-dtb
          - target: radar
            name: Echo 2 (radar)
            kernel_name: tater-echo-radar-kernel.zImage-dtb

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Select version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="${{ inputs.version }}"
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.-]+)?$ ]] || {
            echo "::error::version must look like v0.1.0"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: device/go.mod
          cache-dependency-path: device/go.sum

      - name: Run firmware regression tests
        run: |
          python3 -m unittest \
            factory.test_to_twrp \
            factory.test_to_recovery \
            factory.test_recovery_install
          python3 -m py_compile \
            factory/recovery_install.py \
            factory/to_recovery.py \
            factory/to_twrp.py
          cd device
          go test -race \
            ./internal/actionbutton \
            ./internal/client \
            ./internal/show \
            ./internal/taternative \
            ./internal/wakeword/microwakeword \
            ./internal/aec \
            ./internal/beamformer \
            ./internal/processor \
            ./internal/server \
            ./internal/recovery \
            ./internal/bindings/buttons \
            ./internal/bindings/speaker
          python3 -m py_compile scripts/silent_stream_server.py

      - name: Download shared ONNX Runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tater-onnxruntime-linux-armv7
          path: device/build

      - name: Set up ARMv7 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: arm

      - name: Fetch pinned wake and Linux platform inputs
        shell: bash
        run: |
          mkdir -p device/build/microwakeword-testdata
          curl -fL \
            https://raw.githubusercontent.com/TaterTotterson/Tater-Wake-Words/18f27f6086b4e7c5adfb9f884a80340e2e81970f/microWakeWordsV1/stop.tflite \
            -o device/build/microwakeword-testdata/stop.tflite
          echo '020ef80d522cb09169a866f3aeeb58f2ad4045461937e78e8c806df29ff61eea  device/build/microwakeword-testdata/stop.tflite' | sha256sum -c -
          python3 tools/fetch_platform_input.py platforms.dot.rootfs /tmp/techo5-dot-rootfs.tar.gz
          python3 tools/fetch_platform_input.py \
            'platforms.dot.targets.${{ matrix.target }}.kernel' /tmp/${{ matrix.kernel_name }}
          python3 tools/fetch_platform_input.py \
            platforms.dot.rescue_apks /tmp/techo5-dot-rescue-apks.tar
          python3 tools/fetch_platform_input.py \
            platforms.dot.alpine_rootfs /tmp/alpine-minirootfs.tar.gz
          git clone "$(python3 tools/platform_lock.py get source.repository)" /tmp/tater-echo-linux-dot
          git -C /tmp/tater-echo-linux-dot checkout \
            "$(python3 tools/platform_lock.py get platforms.dot.commit)"

      - name: Build Tater Linux rootfs
        run: |
          linux/dot/build_linux.sh \
            --version '${{ steps.version.outputs.version }}' \
            --target '${{ matrix.target }}' \
            --base-rootfs /tmp/techo5-dot-rootfs.tar.gz \
            --platform /tmp/tater-echo-linux-dot

      - name: Package factory and OTA firmware
        env:
          TATER_DOT_PLATFORM_SOURCE: /tmp/tater-echo-linux-dot
          TATER_DOT_RESCUE_APKS: /tmp/techo5-dot-rescue-apks.tar
          TATER_DOT_ALPINE_ROOTFS: /tmp/alpine-minirootfs.tar.gz
          TATER_BISCUIT_KERNEL: /tmp/tater-echo-biscuit-kernel.zImage-dtb
          TATER_RADAR_KERNEL: /tmp/tater-echo-radar-kernel.zImage-dtb
        run: |
          python3 tools/package_echo_release.py \
            --version '${{ steps.version.outputs.version }}' \
            --target '${{ matrix.target }}' --output release
          mkdir /tmp/tater-factory-check
          tar -xzf release/tater-echo-${{ matrix.target }}-${{ steps.version.outputs.version }}-factory.tar.gz \
            -C /tmp/tater-factory-check
          /tmp/tater-factory-check/*/install.sh --verify-bundle
          tar -tzf release/tater-echo-${{ matrix.target }}-${{ steps.version.outputs.version }}-ota.tar.gz \
            | grep -qx 'tater-echo'
          diff -u \
            <(printf '%s\n' manifest.json rootfs.tar.gz | sort) \
            <(tar -tzf release/tater-echo-${{ matrix.target }}-${{ steps.version.outputs.version }}-system-ota.tar.gz | sort)
          (cd release && sha256sum -c SHA256SUMS)

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tater-echo-${{ matrix.target }}-${{ steps.version.outputs.version }}
          path: release/
          if-no-files-found: error

  checkers:
    name: ${{ matrix.name }} Tater Linux
    needs: [onnxruntime-armv7, ffmpeg-armv7]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: checkers
            name: Echo Show 5 (checkers)
            boot_name: tater-echo-checkers-baseline-boot.img
          - target: crown
            name: Echo Show 8 1st Gen (crown)
            boot_name: tater-echo-crown-baseline-boot.img

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Select version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="${{ inputs.version }}"
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.-]+)?$ ]] || {
            echo "::error::version must look like v0.1.0"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download shared ONNX Runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tater-onnxruntime-linux-armv7
          path: device/build

      - name: Download shared video decoder
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tater-ffmpeg-linux-armv7
          path: device/build

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: device/go.mod
          cache-dependency-path: device/go.sum

      - name: Run shared Echo Show Linux regression tests
        run: |
          python3 -m unittest discover -s linux/checkers -p 'test_*.py'
          python3 -m unittest discover -s factory/checkers-linux -p 'test_*.py'
          python3 -m unittest \
            factory.test_to_twrp \
            factory.test_to_recovery \
            factory.test_recovery_install
          python3 -m unittest tools.test_package_echo_release
          python3 -m py_compile \
            linux/checkers/build_rootfs.py \
            linux/checkers/brand_boot.py \
            linux/checkers/build_rescue_fbprobe.py \
            linux/checkers/provision_console.py \
            factory/checkers-linux/install.py \
            factory/recovery_install.py \
            factory/to_recovery.py \
            factory/to_twrp.py
          cd device
          go test -race \
            ./cmd/tater-show-linux \
            ./internal/bluetooth \
            ./internal/platform \
            ./internal/taternative \
            ./internal/wifi \
            ./internal/show \
            ./internal/videostream \
            ./internal/linuxinput \
            ./internal/linuxscreen \
            ./internal/wakeword/microwakeword \
            ./internal/aec \
            ./internal/beamformer \
            ./internal/recovery \
            ./internal/bindings/buttons \
            ./internal/bindings/mixer \
            ./pkg/board

      - name: Fetch pinned wake models
        shell: bash
        run: |
          mkdir -p device/build/microwakeword-testdata
          curl -fL \
            https://raw.githubusercontent.com/TaterTotterson/Tater-Wake-Words/18f27f6086b4e7c5adfb9f884a80340e2e81970f/microWakeWordsV6/hey_tater.tflite \
            -o device/build/microwakeword-testdata/hey_tater.tflite
          echo 'd3bf0d87c5c00ccfeda3cebba528c5d4012a5aaae51e61b7b01ae5af9008b4b9  device/build/microwakeword-testdata/hey_tater.tflite' | sha256sum -c -
          curl -fL \
            https://raw.githubusercontent.com/TaterTotterson/Tater-Wake-Words/18f27f6086b4e7c5adfb9f884a80340e2e81970f/microWakeWordsV1/stop.tflite \
            -o device/build/microwakeword-testdata/stop.tflite
          echo '020ef80d522cb09169a866f3aeeb58f2ad4045461937e78e8c806df29ff61eea  device/build/microwakeword-testdata/stop.tflite' | sha256sum -c -

      - name: Set up ARMv7 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: arm

      - name: Fetch pinned Echo Show Linux platform
        run: |
          mkdir -p linux/checkers/inputs
          python3 tools/fetch_platform_input.py \
            platforms.show.rootfs linux/checkers/inputs/tater-echo-show-baseline-rootfs.tar.gz
          python3 tools/fetch_platform_input.py \
            'platforms.show.targets.${{ matrix.target }}.boot' \
            'linux/checkers/inputs/${{ matrix.boot_name }}'
          git clone --filter=blob:none \
            "$(python3 tools/platform_lock.py get source.repository)" /tmp/tater-echo-linux-show
          git -C /tmp/tater-echo-linux-show checkout \
            "$(python3 tools/platform_lock.py get platforms.show.checkers_commit)"

      # The pinned TECHO5 camera and rescue helpers require Go 1.26. The
      # preceding Tater regression suite continues to use device/go.mod's
      # Go 1.24; build_linux.sh cross-builds these helpers on the host.
      - name: Set up Go for pinned TECHO5 helpers
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.0'
          cache: false

      - name: Build ${{ matrix.target }} Tater Linux image
        run: |
          linux/checkers/build_linux.sh \
            --version '${{ steps.version.outputs.version }}' \
            --target '${{ matrix.target }}' \
            --base-rootfs linux/checkers/inputs/tater-echo-show-baseline-rootfs.tar.gz \
            --platform /tmp/tater-echo-linux-show/platforms/show \
            --ffmpeg device/build/tater-ffmpeg \
            --ffmpeg-license device/build/FFMPEG-LGPL-2.1.txt \
            --output device/build/tater-${{ matrix.target }}-rootfs-${{ steps.version.outputs.version }}.tar.gz

      - name: Package and verify ${{ matrix.target }} Linux firmware
        env:
          TATER_LINUX_ROOTFS: device/build/tater-${{ matrix.target }}-rootfs-${{ steps.version.outputs.version }}.tar.gz
          TATER_LINUX_BOOT_IMAGE: linux/checkers/inputs/${{ matrix.boot_name }}
        run: |
          python3 tools/package_echo_release.py \
            --version '${{ steps.version.outputs.version }}' \
            --target '${{ matrix.target }}' --output release
          mkdir /tmp/tater-show-factory-check
          tar -xzf release/tater-echo-${{ matrix.target }}-${{ steps.version.outputs.version }}-factory.tar.gz \
            -C /tmp/tater-show-factory-check
          /tmp/tater-show-factory-check/*/install.sh --verify-bundle
          diff -u \
            <(printf '%s\n' FFMPEG-LGPL-2.1.txt manifest.json tater-camera tater-echo tater-ffmpeg tater-show | sort) \
            <(tar -tzf release/tater-echo-${{ matrix.target }}-${{ steps.version.outputs.version }}-ota.tar.gz | sort)
          diff -u \
            <(printf '%s\n' manifest.json tater-echo tater-show | sort) \
            <(tar -tzf release/tater-echo-${{ matrix.target }}-${{ steps.version.outputs.version }}-ota-bridge.tar.gz | sort)
          diff -u \
            <(printf '%s\n' manifest.json rootfs.tar.gz | sort) \
            <(tar -tzf release/tater-echo-${{ matrix.target }}-${{ steps.version.outputs.version }}-system-ota.tar.gz | sort)
          (cd release && sha256sum -c SHA256SUMS)

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tater-echo-${{ matrix.target }}-${{ steps.version.outputs.version }}
          path: release/
          if-no-files-found: error

  athena:
    name: Echo Show 8 2nd Gen (athena) Tater Linux
    needs: [onnxruntime-armv7, ffmpeg-armv7]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Select version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="${{ inputs.version }}"
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.-]+)?$ ]] || {
            echo "::error::version must look like v0.1.0"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download shared ONNX Runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tater-onnxruntime-linux-armv7
          path: device/build

      - name: Download shared video decoder
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tater-ffmpeg-linux-armv7
          path: device/build

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: device/go.mod
          cache-dependency-path: device/go.sum

      - name: Run Athena regression tests
        run: |
          python3 -m unittest discover -s linux/checkers -p 'test_*.py'
          python3 -m unittest \
            factory.test_to_twrp \
            factory.test_to_recovery \
            factory.test_recovery_install \
            tools.test_package_echo_release
          python3 -m py_compile \
            linux/checkers/build_rootfs.py \
            factory/athena-linux/install.py \
            factory/recovery_install.py \
            factory/to_recovery.py \
            factory/to_twrp.py
          cd device
          go test -race \
            ./cmd/tater-show-linux \
            ./internal/bluetooth \
            ./internal/platform \
            ./internal/taternative \
            ./internal/wifi \
            ./internal/show \
            ./internal/videostream \
            ./internal/linuxinput \
            ./internal/linuxscreen \
            ./internal/checkersalsa \
            ./internal/wakeword/microwakeword \
            ./internal/aec \
            ./internal/beamformer \
            ./internal/recovery \
            ./internal/bindings/buttons \
            ./internal/bindings/codec \
            ./internal/bindings/mixer \
            ./internal/bindings/privacy \
            ./internal/bindings/speaker \
            ./internal/server \
            ./pkg/board

      - name: Fetch pinned wake models
        shell: bash
        run: |
          mkdir -p device/build/microwakeword-testdata
          curl -fL \
            https://raw.githubusercontent.com/TaterTotterson/Tater-Wake-Words/18f27f6086b4e7c5adfb9f884a80340e2e81970f/microWakeWordsV6/hey_tater.tflite \
            -o device/build/microwakeword-testdata/hey_tater.tflite
          echo 'd3bf0d87c5c00ccfeda3cebba528c5d4012a5aaae51e61b7b01ae5af9008b4b9  device/build/microwakeword-testdata/hey_tater.tflite' | sha256sum -c -
          curl -fL \
            https://raw.githubusercontent.com/TaterTotterson/Tater-Wake-Words/18f27f6086b4e7c5adfb9f884a80340e2e81970f/microWakeWordsV1/stop.tflite \
            -o device/build/microwakeword-testdata/stop.tflite
          echo '020ef80d522cb09169a866f3aeeb58f2ad4045461937e78e8c806df29ff61eea  device/build/microwakeword-testdata/stop.tflite' | sha256sum -c -

      - name: Set up ARMv7 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: arm

      - name: Fetch pinned Athena platform
        run: |
          mkdir -p linux/athena/inputs
          python3 tools/fetch_platform_input.py \
            platforms.athena.rootfs linux/athena/inputs/tater-echo-athena-baseline-rootfs.tar.gz
          python3 tools/fetch_platform_input.py \
            platforms.athena.boot linux/athena/inputs/tater-echo-athena-kernel-boot.img
          git clone --filter=blob:none \
            "$(python3 tools/platform_lock.py get source.repository)" /tmp/tater-echo-linux-show
          git -C /tmp/tater-echo-linux-show checkout \
            "$(python3 tools/platform_lock.py get platforms.athena.commit)"
          patch -d /tmp/tater-echo-linux-show/platforms/show -p1 \
            < platforms/techo5-athena-reproducible.patch

      - name: Set up Go for pinned Tater Echo Linux helpers
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.0'
          cache: false

      - name: Build Athena Tater Linux rootfs
        run: |
          linux/checkers/build_linux.sh \
            --version '${{ steps.version.outputs.version }}' \
            --target athena \
            --base-rootfs linux/athena/inputs/tater-echo-athena-baseline-rootfs.tar.gz \
            --platform /tmp/tater-echo-linux-show/platforms/show \
            --ffmpeg device/build/tater-ffmpeg \
            --ffmpeg-license device/build/FFMPEG-LGPL-2.1.txt \
            --output device/build/tater-athena-rootfs-${{ steps.version.outputs.version }}.tar.gz

      - name: Build and verify Athena system store
        run: |
          source_date_epoch=$(git show -s --format=%ct HEAD)
          builder=$(python3 tools/platform_lock.py builder-reference --platform linux/amd64)
          docker run --rm --platform linux/amd64 \
            -e APK=/opt/tater/bin/apk.static \
            -e E2FSPROGS_FAKE_TIME="$source_date_epoch" \
            -e SOURCE_DATE_EPOCH="$source_date_epoch" \
            -v "$PWD:/src" -v /tmp/tater-echo-linux-show/platforms/show:/tater-platform:ro -w /src \
            "$builder" bash /tater-platform/tools/linux/athena/mkstore.sh \
              --inner \
              -r device/build/tater-athena-rootfs-${{ steps.version.outputs.version }}.tar.gz \
              -k none \
              -f device/build/tater-rescue-fbprobe \
              -l /tater-platform/logo/tater-boot-315.png \
              -o device/build/tater-athena-system-${{ steps.version.outputs.version }}.img \
              -i /opt/tater/athena-inputs \
              -w /tmp/tater-athena-store
          docker run --rm --platform linux/amd64 -v "$PWD:/src" -w /src "$builder" \
            sh -c "debugfs -R 'cat /.techo5-store' \
              device/build/tater-athena-system-${{ steps.version.outputs.version }}.img 2>/dev/null \
              | grep -qx 'board=athena'"
          docker run --rm --platform linux/amd64 -v "$PWD:/src" -w /src "$builder" \
            sh -c "debugfs -R 'cat /slots/a/etc/tater-release' \
              device/build/tater-athena-system-${{ steps.version.outputs.version }}.img 2>/dev/null \
              | grep -Fqx 'Tater Linux Athena ${{ steps.version.outputs.version }} (TECHO5 platform v1.6.4)'"
          gzip -n -9 -c \
            device/build/tater-athena-system-${{ steps.version.outputs.version }}.img \
            > device/build/tater-athena-system-${{ steps.version.outputs.version }}.img.gz

      - name: Package and verify Athena firmware
        env:
          TATER_ATHENA_PLATFORM_SOURCE: /tmp/tater-echo-linux-show/platforms/show
          TATER_ATHENA_ROOTFS: device/build/tater-athena-rootfs-${{ steps.version.outputs.version }}.tar.gz
          TATER_ATHENA_SYSTEM_IMAGE: device/build/tater-athena-system-${{ steps.version.outputs.version }}.img.gz
          TATER_ATHENA_BOOT_IMAGE: linux/athena/inputs/tater-echo-athena-kernel-boot.img
        run: |
          python3 tools/package_echo_release.py \
            --version '${{ steps.version.outputs.version }}' --target athena --output release
          mkdir /tmp/tater-athena-factory-check
          tar -xzf release/tater-echo-athena-${{ steps.version.outputs.version }}-factory.tar.gz \
            -C /tmp/tater-athena-factory-check
          /tmp/tater-athena-factory-check/*/install.sh --verify-bundle
          diff -u \
            <(printf '%s\n' FFMPEG-LGPL-2.1.txt manifest.json tater-camera tater-echo tater-ffmpeg tater-show | sort) \
            <(tar -tzf release/tater-echo-athena-${{ steps.version.outputs.version }}-ota.tar.gz | sort)
          diff -u \
            <(printf '%s\n' manifest.json tater-echo tater-show | sort) \
            <(tar -tzf release/tater-echo-athena-${{ steps.version.outputs.version }}-ota-bridge.tar.gz | sort)
          diff -u \
            <(printf '%s\n' manifest.json rootfs.tar.gz | sort) \
            <(tar -tzf release/tater-echo-athena-${{ steps.version.outputs.version }}-system-ota.tar.gz | sort)
          (cd release && sha256sum -c SHA256SUMS)

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tater-echo-athena-${{ steps.version.outputs.version }}
          path: release/
          if-no-files-found: error

  rook:
    name: Echo Spot 2017 (rook) Tater Linux
    needs: [onnxruntime-armv7, ffmpeg-armv7]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Select version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="${{ inputs.version }}"
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.-]+)?$ ]] || {
            echo "::error::version must look like v0.1.0"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download shared ONNX Runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tater-onnxruntime-linux-armv7
          path: device/build

      - name: Download shared video decoder
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tater-ffmpeg-linux-armv7
          path: device/build/rook

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: device/go.mod
          cache-dependency-path: device/go.sum

      - name: Run Rook regression tests
        run: |
          python3 -m unittest discover -s linux/rook -p 'test_*.py'
          python3 -m unittest discover -s factory/rook-linux -p 'test_*.py'
          python3 -m unittest \
            factory.test_to_twrp \
            factory.test_to_recovery \
            factory.test_recovery_install
          python3 -m unittest tools.test_package_echo_release
          python3 -m py_compile \
            linux/rook/build_boot.py \
            linux/rook/build_rescue_fbprobe.py \
            linux/rook/build_rootfs.py \
            linux/rook/preflight.py \
            factory/rook-linux/build_factory.py \
            factory/rook-linux/install.py \
            factory/recovery_install.py \
            factory/to_recovery.py \
            factory/to_twrp.py
          cd device
          go test -race \
            ./cmd/tater-show-linux \
            ./internal/bluetooth \
            ./internal/platform \
            ./internal/taternative \
            ./internal/wifi \
            ./internal/show \
            ./internal/videostream \
            ./internal/linuxinput \
            ./internal/linuxscreen \
            ./internal/wakeword/microwakeword \
            ./internal/aec \
            ./internal/beamformer \
            ./internal/recovery \
            ./internal/bindings/buttons \
            ./internal/bindings/mixer \
            ./internal/bindings/speaker \
            ./pkg/board

      - name: Fetch pinned wake models
        shell: bash
        run: |
          mkdir -p device/build/microwakeword-testdata
          curl -fL \
            https://raw.githubusercontent.com/TaterTotterson/Tater-Wake-Words/18f27f6086b4e7c5adfb9f884a80340e2e81970f/microWakeWordsV6/hey_tater.tflite \
            -o device/build/microwakeword-testdata/hey_tater.tflite
          echo 'd3bf0d87c5c00ccfeda3cebba528c5d4012a5aaae51e61b7b01ae5af9008b4b9  device/build/microwakeword-testdata/hey_tater.tflite' | sha256sum -c -
          curl -fL \
            https://raw.githubusercontent.com/TaterTotterson/Tater-Wake-Words/18f27f6086b4e7c5adfb9f884a80340e2e81970f/microWakeWordsV1/stop.tflite \
            -o device/build/microwakeword-testdata/stop.tflite
          echo '020ef80d522cb09169a866f3aeeb58f2ad4045461937e78e8c806df29ff61eea  device/build/microwakeword-testdata/stop.tflite' | sha256sum -c -

      - name: Fetch pinned Rook platform and boot inputs
        run: |
          mkdir -p linux/rook/inputs
          python3 tools/fetch_platform_input.py \
            platforms.rook.rootfs linux/rook/inputs/tater-echo-rook-baseline-rootfs.tar.gz
          python3 tools/fetch_platform_input.py \
            platforms.rook.kernel linux/rook/inputs/tater-echo-rook-baseline-kernel.Image.gz-dtb
          python3 tools/fetch_platform_input.py \
            platforms.rook.rescue linux/rook/inputs/tater-echo-rook-baseline-rescue.tar
          python3 tools/fetch_platform_input.py \
            platforms.rook.lineage linux/rook/inputs/lineage-18.1-20251108-UNOFFICIAL-rook.zip
          python3 tools/fetch_platform_input.py \
            platforms.rook.alpine_rootfs linux/rook/inputs/alpine-minirootfs-3.24.1-armv7.tar.gz
          git clone --filter=blob:none \
            "$(python3 tools/platform_lock.py get source.repository)" /tmp/tater-echo-linux-spot
          git -C /tmp/tater-echo-linux-spot checkout \
            "$(python3 tools/platform_lock.py get platforms.rook.commit)"
          git clone --filter=blob:none \
            "$(python3 tools/platform_lock.py get source.repository)" /tmp/tater-echo-linux-show
          git -C /tmp/tater-echo-linux-show checkout \
            "$(python3 tools/platform_lock.py get platforms.show.checkers_commit)"

      - name: Set up ARMv7 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: arm

      - name: Set up Go for pinned TECHO5 camera helper
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.0'
          cache: false

      - name: Build Rook boot and root filesystem
        run: |
          python3 linux/rook/build_boot.py \
            --lineage-zip linux/rook/inputs/lineage-18.1-20251108-UNOFFICIAL-rook.zip \
            --kernel linux/rook/inputs/tater-echo-rook-baseline-kernel.Image.gz-dtb \
            --rescue linux/rook/inputs/tater-echo-rook-baseline-rescue.tar \
            --alpine-rootfs linux/rook/inputs/alpine-minirootfs-3.24.1-armv7.tar.gz \
            --spot-source /tmp/tater-echo-linux-spot/platforms/spot \
            --show-source /tmp/tater-echo-linux-show/platforms/show \
            --output device/build/rook/tater-rook-boot.img
          sh linux/rook/build_linux.sh \
            --version '${{ steps.version.outputs.version }}' \
            --base-rootfs linux/rook/inputs/tater-echo-rook-baseline-rootfs.tar.gz \
            --spot-source /tmp/tater-echo-linux-spot/platforms/spot --show-source /tmp/tater-echo-linux-show/platforms/show \
            --ffmpeg device/build/rook/tater-ffmpeg \
            --ffmpeg-license device/build/rook/FFMPEG-LGPL-2.1.txt \
            --output device/build/rook/tater-rook-rootfs-${{ steps.version.outputs.version }}.tar.gz

      - name: Package and verify Rook firmware
        env:
          TATER_ROOK_BOOT_IMAGE: device/build/rook/tater-rook-boot.img
        run: |
          python3 tools/package_echo_release.py \
            --version '${{ steps.version.outputs.version }}' --target rook --output release
          mkdir /tmp/tater-rook-factory-check
          tar -xzf release/tater-echo-rook-${{ steps.version.outputs.version }}-factory.tar.gz \
            -C /tmp/tater-rook-factory-check
          /tmp/tater-rook-factory-check/*/install.sh --verify-bundle
          diff -u \
            <(printf '%s\n' FFMPEG-LGPL-2.1.txt manifest.json tater-camera tater-echo tater-ffmpeg tater-show | sort) \
            <(tar -tzf release/tater-echo-rook-${{ steps.version.outputs.version }}-ota.tar.gz | sort)
          diff -u \
            <(printf '%s\n' manifest.json tater-echo tater-show | sort) \
            <(tar -tzf release/tater-echo-rook-${{ steps.version.outputs.version }}-ota-bridge.tar.gz | sort)
          diff -u \
            <(printf '%s\n' manifest.json rootfs.tar.gz | sort) \
            <(tar -tzf release/tater-echo-rook-${{ steps.version.outputs.version }}-system-ota.tar.gz | sort)
          (cd release && sha256sum -c SHA256SUMS)

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tater-echo-rook-${{ steps.version.outputs.version }}
          path: release/
          if-no-files-found: error

  publish:
    name: Publish combined release
    if: github.ref_type == 'tag'
    needs: [biscuit, checkers, athena, rook]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Select version
        id: version
        shell: bash
        run: echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Download Biscuit artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tater-echo-biscuit-${{ steps.version.outputs.version }}
          path: staging/biscuit

      - name: Download Radar artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tater-echo-radar-${{ steps.version.outputs.version }}
          path: staging/radar

      - name: Download Checkers artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tater-echo-checkers-${{ steps.version.outputs.version }}
          path: staging/checkers

      - name: Download Crown artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tater-echo-crown-${{ steps.version.outputs.version }}
          path: staging/crown

      - name: Download Athena artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tater-echo-athena-${{ steps.version.outputs.version }}
          path: staging/athena

      - name: Download Rook artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tater-echo-rook-${{ steps.version.outputs.version }}
          path: staging/rook

      - name: Verify and merge target manifests
        run: |
          python3 tools/merge_release_manifests.py \
            --version '${{ steps.version.outputs.version }}' --output release \
            staging/biscuit/firmware-manifest.json \
            staging/radar/firmware-manifest.json \
            staging/checkers/firmware-manifest.json \
            staging/crown/firmware-manifest.json \
            staging/athena/firmware-manifest.json \
            staging/rook/firmware-manifest.json
          (cd release && sha256sum -c SHA256SUMS)

      - name: Read versioned changelog notes
        shell: bash
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [[ "$(git cat-file -t "$GITHUB_REF_NAME")" != tag ]]; then
            echo "::error::$GITHUB_REF_NAME is lightweight; releases require an annotated tag"
            exit 1
          fi
          python3 tools/release_notes.py "$GITHUB_REF_NAME" > /tmp/release-notes.md
          test -s /tmp/release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b
        with:
          name: Tater Echo Firmware ${{ steps.version.outputs.version }}
          files: release/*
          body_path: /tmp/release-notes.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
