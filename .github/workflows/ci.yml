name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  device-tests:
    name: Firmware and installer tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: device/go.mod
          cache-dependency-path: device/go.sum
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Run Go tests
        working-directory: device
        run: go test ./internal/... ./pkg/... ./cmd/tater-show-linux
      - name: Run factory and release tests
        run: |
          python3 -m unittest \
            tools.test_build_scripts \
            tools.test_platform_lock \
            tools.test_merge_release_manifests \
            tools.test_package_echo_release \
            tools.test_release_notes
          python3 -m unittest discover -s linux/checkers -p 'test_*.py'
          python3 -m unittest discover -s linux/dot -p 'test_*.py'
          python3 -m unittest discover -s factory/checkers-linux -p 'test_*.py'
          python3 -m unittest \
            factory.test_to_twrp \
            factory.test_to_recovery \
            factory.test_recovery_install
          python3 -m unittest discover -s factory/dot-linux -p 'test_*.py'
          python3 -m unittest discover -s linux/rook -p 'test_*.py'
          python3 -m unittest discover -s factory/rook-linux -p 'test_*.py'
          python3 -m py_compile \
            linux/dot/build_rootfs.py \
            factory/dot-linux/install.py \
            factory/recovery_install.py \
            factory/to_recovery.py \
            factory/to_twrp.py \
            tools/package_echo_release.py \
            tools/fetch_platform_input.py \
            tools/platform_lock.py \
            linux/rook/build_boot.py \
            linux/rook/build_rescue_fbprobe.py \
            linux/rook/build_rootfs.py \
            linux/rook/preflight.py \
            factory/rook-linux/build_factory.py \
            factory/rook-linux/install.py
      - name: Check shell entrypoints
        run: |
          sh -n linux/dot/build_linux.sh
          sh -n linux/dot/setup-ap.sh
          sh -n linux/dot/tater-net
          sh -n linux/dot/tater-usb-ethernet
          sh -n linux/dot/wifi-set
          sh -n factory/dot-linux/install.sh
      - name: Test native microWakeWord runtime
        working-directory: device
        run: ./test_microwakeword_runtime.sh

  static-analysis:
    name: Firmware static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: device/go.mod
          cache-dependency-path: device/go.sum
      - name: Run go vet
        working-directory: device
        run: go vet ./internal/... ./pkg/...
      - name: Run govulncheck
        working-directory: device
        run: |
          GOTOOLCHAIN=auto go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./internal/... ./pkg/... || true
      - name: Check Python packers for undefined names
        run: |
          python3 -m pip install pyflakes
          python3 -m pyflakes \
            linux/dot/build_rootfs.py \
            factory/dot-linux/install.py \
            factory/recovery_install.py \
            factory/to_recovery.py \
            factory/to_twrp.py \
            tools/package_echo_release.py
