version: 2

# This repository publishes Echo firmware, not the inherited EchoMuse
# controller image. Keep automated update traffic limited to dependencies that
# are compiled into the firmware or execute with repository credentials.
updates:
  - package-ecosystem: gomod
    directory: /device
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      go-dependencies:
        patterns: ["*"]
    # The pinned Android build image carries Go 1.24 with
    # GOTOOLCHAIN=local. x/sys newer than v0.41.0 requires Go 1.25, so moving
    # this dependency must be paired with a compiler-image and hardware test.
    ignore:
      - dependency-name: golang.org/x/sys
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
